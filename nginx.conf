# nginx.conf - Configuración Institucional de Seguridad para Nginx en Nixpacks

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Encabezados de Seguridad Institucionales
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server {
        listen 80;
        listen [::]:80;
        server_name _;
        root /app;
        index index.php index.html;

        # Límite de tamaño de subida (50MB para expedientes municipales)
        client_max_body_size 50M;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # -------------------------------------------------------------------
        # REGLA CRÍTICA DE SEGURIDAD MUNICIPAL:
        # PROHIBIR ESTRICTAMENTE LA EJECUCIÓN DE SCRIPTS EN LA CARPETA UPLOADS
        # -------------------------------------------------------------------
        location ^~ /uploads/ {
            location ~ \.(php|php3|php4|php5|phtml|pl|py|jsp|asp|sh|cgi|exe|bat|cmd)$ {
                deny all;
                return 404;
            }
        }

        # Procesar archivos PHP legítimos del sistema
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # Denegar acceso a archivos sensibles u ocultos (.env, .git, etc.)
        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
